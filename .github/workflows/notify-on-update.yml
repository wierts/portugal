name: Stuur pushmelding bij site-update

# Triggert pas als de GitHub Pages-deployment ("pages-build-deployment") succesvol
# is afgerond — niet meteen bij de push zelf. Zo staat de nieuwe site al echt live
# op het moment dat de melding (met link) verstuurd wordt.
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check of relevante bestanden zijn gewijzigd
        if: github.event_name == 'workflow_run'
        id: filter
        run: |
          # workflow_run kent geen ingebouwde paths-filter (die bestond bij de oude
          # push-trigger wel). Dit vergelijkt daarom de laatste commit van de push
          # met zijn parent. Bij een push van meerdere commits tegelijk wordt dus
          # niet elke tussenliggende commit los gecontroleerd — in de praktijk
          # (kleine, losse pushes) is dat voldoende; in het ergste geval blijft een
          # melding een keer uit en kan die alsnog handmatig via "Run workflow".
          changed=$(git diff --name-only HEAD^ HEAD || echo "")
          echo "Gewijzigde bestanden:"
          echo "$changed"
          if echo "$changed" | grep -Eq '\.html$|^manifest\.json$|^sw\.js$|^onesignal-init\.js$|^\.github/workflows/notify-on-update\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verstuur OneSignal pushmelding
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.relevant == 'true'
        run: |
          if [ -z "${{ secrets.ONESIGNAL_APP_ID }}" ] || [ -z "${{ secrets.ONESIGNAL_REST_API_KEY }}" ]; then
            echo "::error::ONESIGNAL_APP_ID of ONESIGNAL_REST_API_KEY secret ontbreekt nog — sla melding over. Zie README-pushmeldingen.md."
            exit 1
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST https://onesignal.com/api/v1/notifications \
            -H "Authorization: Key ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "app_id": "${{ secrets.ONESIGNAL_APP_ID }}",
              "included_segments": ["Total Subscriptions"],
              "headings": {"en": "Portugal Roadtrip bijgewerkt"},
              "contents": {"en": "Er is iets veranderd in de reisgids — tik om te bekijken."},
              "url": "https://wierts.github.io/portugal/"
            }')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $http_code"
          echo "Response body: $body"

          if [ "$http_code" -ge 400 ]; then
            echo "::error::OneSignal-melding is niet verstuurd — HTTP $http_code. Zie response body hierboven."
            exit 1
          fi

          if echo "$body" | grep -q '"errors"'; then
            echo "::error::OneSignal-melding is niet (volledig) verstuurd — zie response body hierboven."
            exit 1
          fi

          if ! echo "$body" | grep -q '"id"'; then
            echo "::error::Geen id in de response — melding is waarschijnlijk niet verstuurd."
            exit 1
          fi

          if echo "$body" | grep -q '"recipients"'; then
            recipients=$(echo "$body" | grep -o '"recipients":[0-9]*' | grep -o '[0-9]*')
            echo "Aantal ontvangers: $recipients"
            if [ "$recipients" -eq 0 ]; then
              echo "::error::Melding verstuurd maar 0 ontvangers — controleer of er nog abonnees zijn."
              exit 1
            fi
          else
            echo "Melding verstuurd (geen 'recipients'-veld in de response, aantal ontvangers onbekend)."
          fi
