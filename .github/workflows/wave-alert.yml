name: Golfalert Nazaré

on:
  schedule:
    # 07:00 en 19:00 UTC = ±08:00/09:00 en ±20:00/21:00 in Portugal, afhankelijk van zomertijd
    - cron: '0 7,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check golfvoorspelling Nazaré en verstuur eventueel een melding
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python3 scripts/check_nazare_waves.py

      - name: Commit bijgewerkte state (indien gewijzigd)
        run: |
          if git diff --quiet -- data/nazare-golfalert-state.json; then
            echo "Geen wijzigingen in state-bestand."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nazare-golfalert-state.json
          git commit -m "Bijwerken golfalert state [skip ci]"
          git push
